<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Award Banner Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="studio">
      <section class="stage-wrap" aria-label="배너 미리보기">
        <div class="topbar">
          <div>
            <p class="kicker">Award Banner Studio</p>
            <h1>시상식 배너 제작</h1>
          </div>
          <button class="primary-action" id="downloadBtn" type="button">
            <span aria-hidden="true">↓</span>
            PNG 저장
          </button>
        </div>

        <div class="stage-shell">
          <canvas id="bannerCanvas" width="1920" height="1080"></canvas>
        </div>
      </section>

      <aside class="panel" aria-label="배너 설정">
        <div class="panel-section">
          <h2>이미지</h2>
          <label class="file-drop">
            <input id="imageInput" type="file" accept="image/*" />
            <span class="file-icon" aria-hidden="true">＋</span>
            <span>
              배우나 영화 스틸컷 업로드
              <small>JPG, PNG, WebP</small>
            </span>
          </label>
          <div class="segmented" role="group" aria-label="이미지 맞춤">
            <button class="is-active" data-fit="cover" type="button">채우기</button>
            <button data-fit="contain" type="button">전체</button>
          </div>
        </div>

        <div class="panel-section">
          <h2>문구</h2>
          <label>
            수상 부문
            <input id="categoryInput" type="text" value="BEST ACTOR" />
          </label>
          <label>
            이름 / 작품명
            <input id="titleInput" type="text" value="한지민" />
          </label>
          <label>
            보조 문구
            <input id="subtitleInput" type="text" value="영화 &lt;밤의 계단&gt;" />
          </label>
          <label>
            행사명
            <input id="eventInput" type="text" value="2026 KOREA FILM AWARDS" />
          </label>
        </div>

        <div class="panel-section">
          <h2>디자인</h2>
          <label>
            프리셋
            <select id="presetSelect">
              <option value="cinema">Cinema Gold</option>
              <option value="noir">Noir Silver</option>
              <option value="festival">Festival Red</option>
              <option value="broadcast">Broadcast Blue</option>
            </select>
          </label>
          <label>
            비율
            <select id="sizeSelect">
              <option value="1920x1080">16:9 방송 화면</option>
              <option value="1920x640">와이드 하단 배너</option>
              <option value="1080x1350">세로 포스터</option>
              <option value="1080x1080">정사각형 SNS</option>
            </select>
          </label>
          <div class="color-grid">
            <label>
              포인트
              <input id="accentInput" type="color" value="#d8b45f" />
            </label>
            <label>
              배경
              <input id="bgInput" type="color" value="#111111" />
            </label>
          </div>
          <label>
            이미지 밝기
            <input id="brightnessInput" type="range" min="35" max="115" value="78" />
          </label>
          <label>
            배너 높이
            <input id="bandInput" type="range" min="22" max="48" value="34" />
          </label>
        </div>

        <div class="panel-section">
          <h2>배치</h2>
          <div class="segmented" id="layoutButtons" role="group" aria-label="레이아웃">
            <button class="is-active" data-layout="lower" type="button">하단</button>
            <button data-layout="left" type="button">좌측</button>
            <button data-layout="split" type="button">분할</button>
          </div>
          <label class="toggle-row">
            <input id="laurelInput" type="checkbox" checked />
            월계 장식
          </label>
          <label class="toggle-row">
            <input id="shineInput" type="checkbox" checked />
            조명 효과
          </label>
        </div>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
